name: Refresh discovery

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "discovery.py"
      - "test_discovery.py"
      - "config/discovery.json"
      - ".github/workflows/refresh-discovery.yml"
  schedule:
    # 09:07-14:52 KST, Mon-Fri = 00:07-05:52 UTC, Mon-Fri
    - cron: "7,22,37,52 0-5 * * 1-5"
    # 15:07, 15:22, 15:37 KST, Mon-Fri = 06:07, 06:22, 06:37 UTC, Mon-Fri
    - cron: "7,22,37 6 * * 1-5"

permissions:
  contents: write

jobs:
  refresh-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check KRX trading day
        id: market_day
        shell: bash
        run: |
          set +e
          python krx_market_day.py
          code=$?
          if [ "$code" -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping discovery refresh (closed market or unverifiable KRX calendar)."
          fi
          exit 0

      - name: Test discovery
        if: steps.market_day.outputs.run == 'true'
        run: python -m unittest test_discovery.py test_krx_market_day.py -v

      - name: Build latest and history
        if: steps.market_day.outputs.run == 'true'
        run: python discovery.py all

      - name: Commit discovery outputs
        if: steps.market_day.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidates data/market-context data/history
          if git diff --cached --quiet; then
            echo "No discovery output changes to commit"
          else
            git commit -m "Refresh market discovery"
            git push
          fi
